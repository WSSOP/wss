# 问星渡后端服务｜开发环境配置
# 激活方式：spring.profiles.active=dev（application.yml 默认值）
# 启动命令：直接运行，无需额外参数

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wenxingdu?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 3s

  # 开发环境：每次启动自动建表/迁移，出错不中断
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema.sql
        - classpath:sql/wenxingdu_full_schema.sql
        - classpath:sql/planetary_jewelry_tables.sql
        - classpath:sql/planetary_jewelry_catalog_tables.sql
        - classpath:sql/planetary_jewelry_catalog_seed.sql
        - classpath:sql/mall_tables.sql
        - classpath:sql/mall_order_tables.sql
        - classpath:sql/learning_course_event_tables.sql
        - classpath:sql/user_role_tables.sql
        - classpath:sql/psychological_assessment_tables.sql
        - classpath:sql/psychological_assessment_seed.sql
        - classpath:relationship-report-table.sql
        - classpath:alter-report-instance.sql
        - classpath:chart-table.sql
      continue-on-error: true

# JWT 密钥（开发环境用短密钥即可，生产必须更换）
wenxingdu:
  jwt:
    secret: dev-jwt-secret-key-change-in-production-2026

# AI API（开发环境，可通过环境变量 AI_API_KEY 覆盖）
ai:
  base-url: https://v1.wifdo.com/v1
  api-key: ${AI_API_KEY:sk-dev-placeholder}

# VedicAstro 占星服务（开发环境本地代理）
vedic-astro:
  base-url: http://127.0.0.1:8088
  timeout: 30000

# 日志：开发环境输出 SQL 和执行细节
logging:
  level:
    cn.dct.zpback: DEBUG
    cn.dct.zpback.mapper: DEBUG
    org.springframework.jdbc: DEBUG
